<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CFP - Controle Financeiro Pessoal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d5bd8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Controle Financeiro" />
    <meta name="application-name" content="Controle Financeiro" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=block"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // aplica o tema antes do Angular subir, evitando piscar claro
      var t = localStorage.getItem('cfp.tema');
      if (t === 'claro') document.documentElement.dataset.theme = 'light';
      if (t === 'escuro') document.documentElement.dataset.theme = 'dark';
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Ative o JavaScript para usar o CFP.</noscript>
  </body>
</html>
